name: chemia
description: Aplicacion educativa de quimica para estudiantes escolares de Bolivia.
publish_to: 'none'
version: 1.5.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  model_viewer_plus: ^1.7.2
  provider: ^6.1.1
  http: ^1.1.0
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/
    - assets/data/elements.json
    - assets/data/
    - assets/data/games/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/logo_chemia.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3F51B5" # Color Indigo de ChemIA
  adaptive_icon_foreground: "assets/icon/logo_chemia.png"

flutter_native_splash:
  color: "#3F51B5"
  image: "assets/icon/logo_chemia.png"
  android_12:
    image: "assets/icon/logo_chemia.png"
    icon_background_color: "#3F51B5"
  web: false